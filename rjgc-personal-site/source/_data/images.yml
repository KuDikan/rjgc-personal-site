# ShokaX 随机封面图配置
#
# 主题的 scripts/generaters/config.js 读取 hexo.locals.get('data').images，
# 该值来自 source/_data/images.yml。
#
# 两个关键点：
#  1. 本文件根节点必须**直接是数组**。若写成 `images: [...]`，
#     data.images 会变成整个对象 {images: [...]}，其 .length 为 undefined，
#     主题判定为"未配置"并回退到包内空的 _images.yml。
#  2. 至少 6 张。少于 6 张时 randomBG() 抛错并中止构建
#     （源码注释：少于 6 项会阻塞主线程导致终端崩溃）。
#     npm 包自带的 _images.yml 是 0 字节空文件，所以必须自己提供。
#
# 使用本地 SVG，不依赖任何境外随机图服务。
# 注意 source/_data/assets/ 下必须是**扁平结构**：主题的 images 生成器
# 会对该目录 readdir 后逐个 readFile，嵌套子目录会触发 EISDIR。
- /assets/cover-1.svg
- /assets/cover-2.svg
- /assets/cover-3.svg
- /assets/cover-4.svg
- /assets/cover-5.svg
- /assets/cover-6.svg