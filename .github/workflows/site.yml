name: site

on:
  push:
    branches: [main]
    paths:
      - 'rjgc-personal-site/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'rjgc-personal-site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# 连续 push 时取消进行中的旧任务，避免两个部署互相覆盖
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 构建（Hexo 7 + ShokaX）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rjgc-personal-site
    env:
      TZ: UTC
      # 注意：不要设置 NODE_ENV=production。
      # 站点依赖（hexo、hexo-theme-shokax、wrangler 等）全部声明在 devDependencies，
      # 而 NODE_ENV=production 会让 `npm ci` 跳过 devDependencies，
      # 结果 node_modules 为空、构建工具缺失。
      # NODE_ENV=production: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 准备 Node（版本来自 .nvmrc）
        uses: actions/setup-node@v4
        with:
          node-version-file: rjgc-personal-site/.nvmrc
          cache: npm
          cache-dependency-path: rjgc-personal-site/package-lock.json

      - name: 校验 lockfile 未被篡改
        run: git diff --exit-code -- package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 断言主题可用（预构建产物 / hexo 版本唯一 / stylus 渲染器）
        run: npm run verify:theme

      - name: 生成数据（论文 / RSS / 状态）
        run: npm run data

      - name: 构建站点
        run: npx hexo clean && npx hexo generate

      # Pagefind 是构建**后**索引，不在 hexo generate 内部。
      # 漏掉这一步 → 搜索按钮可点但永远无结果，且不报错。
      - name: 生成搜索索引（Pagefind）
        run: npx pagefind --site public

      # 必须在 pagefind 之后：pagefind 的索引文件也要纳入缓存规则。
      # 也必须在 hexo generate 之后：hexo clean 会清空 public/。
      - name: 生成缓存规则（_headers）
        run: npm run headers

      - name: 校验数据与产物
        run: node tools/validate.mjs

      - name: 断言关键产物存在
        run: |
          set -e
          for f in index.html 404.html about/index.html categories/index.html \
                   archives/index.html tags/index.html papers/index.html \
                   rss/index.html wiki/index.html status/index.html \
                   rss.xml atom.xml feed.json css/app.css \
                   pagefind/pagefind.js _headers; do
            test -s "public/$f" || { echo "缺少或为空: public/$f"; exit 1; }
          done
          echo "文件总数: $(find public -type f | wc -l)"
          echo "体积: $(du -sh public | cut -f1)"

      # 播放器数据必须真的进了 JS bundle。只检查 _config.shokax.yml 里有
      # audio 是不够的——数据可能停在配置里没被打包，运行时 CONFIG.audio
      # 仍是 undefined，前端会抛 TypeError 并静默失效（按钮在、点了没反应）。
      # 注意：本job 已设 working-directory: rjgc-personal-site，不要再 cd。
      - name: 断言播放器数据已进产物
        run: |
          set -e
          node tools/verify-player-bundle.mjs

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: rjgc-personal-site/public
          retention-days: 7

  deploy:
    name: 部署（Cloudflare Workers）
    needs: build
    # PR 与 fork 不部署：既避免半成品上线，也避免 fork 拿不到 secrets 而报错
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://personal-blog.kukuku.icu
    defaults:
      run:
        working-directory: rjgc-personal-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: rjgc-personal-site/.nvmrc
          cache: npm
          cache-dependency-path: rjgc-personal-site/package-lock.json

      - name: 安装部署所需的依赖
        run: npm ci

      # 部署的就是 build job 已验证过的那份产物，避免"本地/CI 各自构建导致不一致"
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: site-public
          path: rjgc-personal-site/public

      - name: 部署到 Cloudflare
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy

      # 冒烟目标的选择：
      #   - 优先用 wrangler 实际返回的 deployment-url（workers.dev）；
      #   - 配置 routes 后 wrangler 默认关闭 workers_dev，该输出会是空串，
      #     此时回退到自定义域名。
      # workers.dev 在部分网络（含中国大陆）会被 DNS 污染而不可达，
      # 所以两条路径都不可用时不应把"部署失败"和"本机网络不通"混为一谈。
      #
      # 注意：deploy step 并未设置任何 output，所以 steps.deploy.outputs
      # 实际恒为空，冒烟测试始终走自定义域名分支。
      #
      # ## 为什么失败只警告不崩溃
      #
      # 站点用了自定义 CDN IP，GitHub Actions 到它的网络链路不稳定，
      # 冒烟失败往往是"CI 到不了站点"而非"站点坏了"。
      # 若在此 exit 1，会把网络问题误报成部署失败、阻塞流水线。
      # 因此所有冒烟项**降级为 ::warning::**，人工看到告警再复核。
      #
      # AGPL 的告警可以放心降级：build job 的 tools/validate.mjs 已经在
      # **本地产物**上断言过署名链接存在（不依赖网络），法定义务有兜底；
      # 这里只是对线上再做一次确认。
      - name: 冒烟测试（失败仅告警，不阻塞部署）
        run: |
          set -u
          paths="/ /about/ /papers/ /wiki/ /status/ /rss/ /categories/ /archives/ /tags/ /rss.xml /atom.xml /feed.json"
          custom="https://personal-blog.kukuku.icu"

          base="${{ steps.deploy.outputs.deployment-url }}"
          base="${base%/}"
          if [ -z "$base" ]; then
            echo "::notice::wrangler 未返回 deployment-url，改用 $custom"
            base="$custom"
          fi
          echo "== 冒烟目标: $base =="

          pass=0
          fail=0
          warn() { echo "::warning::$1"; fail=$((fail + 1)); }

          # AGPL-3.0 §7(b)：必须保留指向主题仓库的署名链接。
          if curl -fsS --max-time 30 "$base/" 2>/dev/null | grep -qi 'theme-shoka-x/hexo-theme-shokax'; then
            echo '  署名链接存在: OK'
            pass=$((pass + 1))
          else
            warn "缺少 ShokaX 署名链接（AGPL §7(b)）。build job 的 validate.mjs 已本地断言通过，请人工复核线上。"
          fi

          for p in $paths; do
            # curl 连不上时 -w 仍会输出 000，故失败码统一视为 000
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base$p" 2>/dev/null)
            code="${code:-000}"
            if [ "$code" = "200" ]; then
              echo "  $p -> $code"
              pass=$((pass + 1))
            else
              echo "  $p -> $code"
              warn "冒烟项未通过: $p 返回 $code"
            fi
          done

          echo ""
          if [ "$fail" -eq 0 ]; then
            echo "冒烟测试全部通过（$pass 项）"
          else
            echo "::warning::冒烟测试 $fail 项未通过 / 共 $((pass + fail)) 项 —— 已降级为告警，不阻塞部署。"
            echo "常见原因：GitHub Actions 到 $base 的网络不通（如 CDN IP 配置）。"
            echo "请人工访问该地址复核。"
          fi